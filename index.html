<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Bé đi khắp nơi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: sổ hành trình của Mai — trang bìa có tranh mở đầu, các chặng xếp theo 3 khu (Nhà em · Trường em · Phố phường),
   vào chặng là 3 bước: Em khám phá → Thử thách → Vận dụng. Thế giới tranh tươi sáng, cố ý dùng một giao diện sáng. */
:root{
  color-scheme:light;
  --sky:#E6F4FC; --paper:#FFFDF7; --ink:#24324A; --muted:#5B6880; --line:#D9E4EC;
  --sun:#FFC93C; --sun-soft:#FFF3CC;
  --c-home:#F26B4F; --c-home-soft:#FFE6DF;
  --c-school:#2F8FD8; --c-school-soft:#DCEEFB;
  --c-town:#3AA85A; --c-town-soft:#DFF3E3;
  --ok:#2E9D55; --ok-soft:#DDF5E4; --bad:#E0533D; --bad-soft:#FDE3DD;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  --r:18px; --en:#7A4CC2; --en-soft:#EEE6FA;
}
*{box-sizing:border-box}
html,body{background:var(--sky)}
body{color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,.card:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
img{display:block;max-width:100%}

/* Top bar */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar .brand{font-family:var(--f-display);font-weight:800;font-size:22px;display:flex;align-items:center;gap:8px}
.bar .brand img{width:38px;height:38px;object-fit:contain}
.bar .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--paper);border:2px solid var(--line);font-weight:800;font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:999px;font-family:var(--f-display);font-weight:700;font-size:20px;
  background:var(--sun);color:var(--ink);box-shadow:0 4px 0 #D9A21A;transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #D9A21A}
.btn.ghost{background:var(--paper);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.blue{background:var(--c-school);color:#fff;box-shadow:0 4px 0 #1F6BA6}
.btn[disabled]{opacity:.45;pointer-events:none}

/* Home */
.hero{position:relative;border-radius:24px;overflow:hidden;border:4px solid var(--paper);box-shadow:0 8px 24px rgba(36,50,74,.12)}
.hero img{width:100%;aspect-ratio:16/9;object-fit:cover}
.hero .ttl{position:absolute;left:0;right:0;top:4%;text-align:center;padding-inline:12px}
.hero h1{font-size:clamp(34px,7vw,72px);font-weight:800;color:#fff;letter-spacing:.5px;
  text-shadow:0 3px 0 var(--c-home),0 6px 0 rgba(36,50,74,.25)}
.hero .sub{display:inline-block;margin-top:6px;background:var(--paper);border-radius:999px;padding:4px 14px;font-weight:800;font-size:clamp(13px,2vw,17px)}
.topic{background:var(--paper);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;border-top:8px solid var(--tc)}
.topic-h{display:flex;align-items:center;gap:12px}
.topic-h img{width:58px;height:58px;object-fit:contain}
.topic-h h2{font-size:26px}
.topic-h .meta{color:var(--muted);font-weight:700;font-size:14px}
.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.card{position:relative;display:flex;flex-direction:column;text-align:left;background:var(--tcs);border-radius:16px;overflow:hidden;border:3px solid transparent;transition:transform .15s}
.card:hover{transform:translateY(-3px);border-color:var(--tc)}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#fff}
.card .cb{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px}
.card .no{font-family:var(--f-display);font-weight:800;color:var(--tc);font-size:15px}
.card .nm{font-weight:800;line-height:1.2}
.card .st{position:absolute;top:6px;right:6px;background:var(--paper);border-radius:999px;padding:1px 8px;font-size:14px;font-weight:800}
.card.star .no::after{content:" ★ Ôn tập"}
.album{background:var(--paper);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.album h2{font-size:22px}
.who{background:var(--paper);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;border-top:8px solid var(--sun)}
.who h2{font-size:clamp(26px,4vw,34px)}
.who input{font:inherit;font-size:22px;font-weight:700;padding:12px 16px;border-radius:14px;border:3px solid var(--line);background:#fff;color:var(--ink);width:100%}
.who input:focus{outline:none;border-color:var(--c-school)}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.names button{padding:12px 14px;border-radius:14px;background:var(--sky);border:3px solid transparent;font-weight:800;font-size:18px;text-align:left;display:flex;justify-content:space-between;gap:8px;align-items:center}
.names button:hover{border-color:var(--c-school)}
.names button small{color:var(--muted);font-weight:700;white-space:nowrap}
.me{background:var(--sun-soft);border-color:var(--sun)}
.board{background:var(--paper);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.board h2{font-size:clamp(24px,4vw,32px)}
.btab{overflow-x:auto}
.btab table{border-collapse:collapse;width:100%;min-width:900px;font-variant-numeric:tabular-nums}
.btab th,.btab td{border-bottom:2px solid var(--line);padding:7px 6px;text-align:center;font-size:15px;white-space:nowrap}
.btab th{background:var(--sky);font-family:var(--f-display);font-size:15px;position:sticky;top:0}
.btab td.nm,.btab th.nm{text-align:left;font-weight:800;position:sticky;left:0;background:var(--paper)}
.btab th.nm{background:var(--sky)}
.btab .st3{color:#D9900B;font-weight:800}
.btab .st0{color:var(--line)}
.btab .tot{font-weight:800;font-size:17px}
.btab tr.mine td{background:var(--sun-soft)}
.btab th.t-gd{border-top:5px solid var(--c-home)} .btab th.t-th{border-top:5px solid var(--c-school)} .btab th.t-cd{border-top:5px solid var(--c-town)}
.sync{font-size:13px;font-weight:700;color:var(--muted)}
.stk{display:flex;flex-wrap:wrap;gap:10px}
.stk .s{width:64px;height:64px;border-radius:14px;background:var(--sky);display:grid;place-items:center;border:2px dashed var(--line)}
.stk .s img{width:56px;height:56px;object-fit:contain;filter:grayscale(1) opacity(.25)}
.stk .s.got{border-style:solid;border-color:var(--sun);background:var(--sun-soft)}
.stk .s.got img{filter:none}
.note{color:var(--muted);font-size:14px}

/* Stage */
.stage-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--paper);border-radius:var(--r);padding:12px 16px;border-left:10px solid var(--tc)}
.stage-h h2{font-size:clamp(22px,4vw,30px)}
.stage-h .k{font-weight:800;color:var(--tc);font-size:14px;text-transform:uppercase;letter-spacing:.6px}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.steps span{padding:6px 14px;border-radius:999px;background:var(--paper);font-weight:800;font-size:15px;color:var(--muted);border:2px solid var(--line)}
.steps span.on{background:var(--tc);color:#fff;border-color:var(--tc)}
.guide{display:flex;gap:12px;align-items:flex-end}
.guide img{width:84px;flex:none}
.bubble{background:var(--paper);border-radius:18px 18px 18px 4px;padding:12px 16px;font-weight:700;box-shadow:0 3px 0 var(--line);flex:1;min-width:0}
.ex{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.exc{background:var(--paper);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.exc .main{width:100%;aspect-ratio:16/10;object-fit:contain;background:#fff}
.exc .more{display:flex;gap:6px;padding:8px 10px 0}
.exc .more img{flex:1;min-width:0;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line)}
.exc p{padding:10px 14px 14px;font-size:18px}
.exc b{color:var(--tc)}
.src{background:var(--paper);border-radius:var(--r);padding:12px 16px;font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.src strong{color:var(--ink)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* Quiz */
.qtop{display:flex;align-items:center;gap:12px}
.prog{flex:1;height:14px;border-radius:999px;background:var(--paper);overflow:hidden;border:2px solid var(--line)}
.prog i{display:block;height:100%;background:var(--tc);transition:width .3s}
.qbox{background:var(--paper);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:16px;box-shadow:0 6px 0 var(--line)}
.qtype{font-weight:800;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--tc)}
.qq{display:flex;gap:10px;align-items:flex-start}
.qq h3{font-size:clamp(22px,3.6vw,30px);font-weight:700;flex:1}
.say{flex:none;width:46px;height:46px;border-radius:50%;background:var(--tcs);font-size:22px;display:grid;place-items:center}
.qimg{width:100%;max-height:52vh;object-fit:contain;border-radius:14px;background:#fff;border:2px solid var(--line)}
.qimg.sq{max-width:420px;margin:0 auto}
.opts{display:grid;gap:12px}
.opts.txt{grid-template-columns:1fr}
.opts.img{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opt{border:3px solid var(--line);border-radius:16px;background:var(--paper);padding:14px 16px;font-weight:800;font-size:20px;text-align:left;display:flex;align-items:center;gap:12px;transition:border-color .15s,transform .1s}
.opt:hover{border-color:var(--tc)}
.opt .lt{flex:none;width:36px;height:36px;border-radius:50%;background:var(--tcs);display:grid;place-items:center;font-family:var(--f-display)}
.opt.im{padding:8px;flex-direction:column}
.opt.im img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:10px;background:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{padding:18px;border-radius:18px;font-family:var(--f-display);font-weight:800;font-size:24px;display:flex;flex-direction:column;align-items:center;gap:4px;border:3px solid transparent}
.big .e{font-size:44px;line-height:1}
.big.g{background:var(--ok-soft);color:var(--ok)}
.big.b{background:var(--bad-soft);color:var(--bad)}
.big.sel{border-color:currentColor}
.big.dim{opacity:.4}
/* sort */
.sorts{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.si{border:3px solid var(--line);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:8px;background:var(--paper)}
.si img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:10px;background:#fff}
.si .tx{min-height:70px;display:grid;place-items:center;text-align:center;font-weight:800;font-size:18px;background:var(--sky);border-radius:10px;padding:6px}
.bins{display:flex;flex-wrap:wrap;gap:6px}
.bins button{flex:1 1 auto;padding:6px 8px;border-radius:10px;font-weight:800;font-size:14px;background:var(--sky);border:2px solid var(--line)}
.bins button.sel{background:var(--tc);color:#fff;border-color:var(--tc)}
.si.ok{border-color:var(--ok);background:var(--ok-soft)}
.si.no{border-color:var(--bad);background:var(--bad-soft)}
.si .fix{font-size:13px;font-weight:800;color:var(--bad)}
/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
.mcol{display:flex;flex-direction:column;gap:10px}
.mi{border:3px solid var(--line);border-radius:14px;background:var(--paper);padding:6px;display:flex;align-items:center;gap:10px;min-height:86px;text-align:left;font-weight:800;font-size:18px}
.mi img{width:80px;height:80px;object-fit:contain;border-radius:8px;background:#fff;flex:none}
.mi .lab{flex:1;min-width:0}
.mi.cur{border-color:var(--sun);background:var(--sun-soft)}
.mi .tag{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-size:16px}
.mi.ok{border-color:var(--ok)} .mi.no{border-color:var(--bad)}
/* order */
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.slot{border:3px dashed var(--line);border-radius:14px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;background:var(--sky);font-weight:800;color:var(--muted)}
.slot.fill{border-style:solid;border-color:var(--tc);background:var(--paper);color:var(--ink)}
.slot img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:8px;background:#fff}
.slot .n,.pool .n{font-family:var(--f-display);font-size:20px}
.slot .tx,.pool .tx{text-align:center;font-size:16px;padding:4px}
.slot.ok{border-color:var(--ok);background:var(--ok-soft)} .slot.no{border-color:var(--bad);background:var(--bad-soft)}
.pool{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.pool button{border:3px solid var(--line);border-radius:14px;background:var(--paper);padding:6px;font-weight:800}
.pool button img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:8px;background:#fff}
.pool button.used{visibility:hidden}
/* plan */
.plan{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.plan .bins button{font-size:13px}
.table{overflow-x:auto}
.table table{border-collapse:collapse;width:100%;min-width:520px;background:var(--paper);border-radius:12px;overflow:hidden}
.table th,.table td{border:2px solid var(--line);padding:8px;text-align:center;vertical-align:top;font-weight:700;font-size:15px}
.table th{background:var(--tcs)}
.table td img{width:70px;height:70px;object-fit:contain;margin:0 auto}

/* feedback */
.fb{display:flex;align-items:center;gap:14px;border-radius:18px;padding:12px 16px}
.fb img{width:84px;height:84px;object-fit:contain;flex:none}
.fb h3{font-size:26px}
.fb p{font-weight:700}
.fb.good{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb .tx{flex:1;min-width:0}
.fb .tx p{color:var(--ink)}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pp .45s}
@keyframes pp{0%{transform:scale(.7)}60%{transform:scale(1.08)}100%{transform:scale(1)}}

/* result */
.res{background:var(--paper);border-radius:24px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.res .stars{font-size:54px;letter-spacing:6px;color:var(--sun);text-shadow:0 3px 0 #D9A21A}
.res .stars .off{color:var(--line);text-shadow:none}
.res .reward{width:150px;height:150px;object-fit:contain}
.res h2{font-size:34px}
.tasks{background:var(--paper);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.tasks h3{font-size:24px}
.task{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--tcs);font-weight:700;font-size:18px;text-align:left}
.task .bx{flex:none;width:32px;height:32px;border-radius:10px;border:3px solid var(--tc);background:var(--paper);display:grid;place-items:center;font-size:20px;color:var(--ok)}
.final img{width:100%;border-radius:20px}

.en{display:block;font-family:var(--f-body);font-weight:700;font-size:.72em;color:var(--en);font-style:italic;letter-spacing:.2px;line-height:1.2}
.en-t{color:var(--en);font-style:italic;font-weight:700}
.bi-on{background:var(--en-soft);border-color:var(--en);color:var(--en)}
.vocab{background:var(--paper);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;border:3px dashed var(--en)}
.vocab h3{font-size:24px;display:flex;align-items:center;gap:10px}
.vocab h3 .tag{font-family:var(--f-body);font-size:13px;font-weight:800;background:var(--en);color:#fff;border-radius:999px;padding:2px 10px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.vw{border-radius:14px;background:var(--sky);padding:8px;display:flex;flex-direction:column;gap:6px;text-align:center}
.vw img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:10px;background:#fff}
.vw .noimg{aspect-ratio:1;border-radius:10px;background:#fff;display:grid;place-items:center;font-size:44px}
.vw .vi{font-weight:800;font-size:19px;line-height:1.2}
.vw .enw{font-weight:800;font-size:18px;color:var(--en);line-height:1.2}
.vw .sp2{display:flex;gap:6px;justify-content:center}
.vw .sp2 button{white-space:nowrap;border-radius:999px;padding:4px 8px;font-size:13px;font-weight:800;background:var(--paper);border:2px solid var(--line)}
@media (max-width:560px){
  .match{grid-template-columns:1fr 1fr;gap:8px}
  .mi{min-height:70px;font-size:15px;gap:6px}
  .mi img{width:56px;height:56px}
  .guide img{width:60px}
  .opts.img{grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
  .opt.im{padding:4px}
  .big .e{font-size:34px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap" id="app"></div>

<script src="data.js"></script>
<script src="words.js"></script>
<script src="roster.js"></script>
<script>
const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };
const isImg = (s) => typeof s === 'string' && (/^\d\d_/.test(s) || /^(Mai|Cun)_/.test(s));
const src = (s) => /^\d/.test(s) ? 'img/C' + s + '.jpg' : 'img/' + s + '.png';
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const strip = (s) => s.replace(/<[^>]+>/g, '');
const topicOf = (n) => TOPICS.find(t => t.chặng.includes(n));
const TYPE_NAME = { mcq: 'Chọn đáp án', pick: 'Chọn hình đúng', tf: 'Đúng hay sai?', face: 'Nên hay không nên?', sort: 'Xếp vào nhóm', match: 'Nối cho đúng', order: 'Sắp xếp thứ tự', plan: 'Lập kế hoạch' };
const LET = ['A', 'B', 'C', 'D'];
const PAIRC = ['#F26B4F', '#2F8FD8', '#3AA85A', '#9B59B6', '#E3A008'];

/* progress (per-viewer only) */
/* Tiến độ học sinh: lưu chung cho cả lớp (db của trang) — nếu không có thì lưu trên máy này. */
let SID = null; try { SID = localStorage.getItem('tnxh1-sid'); } catch (e) {}
if (!ROSTER.some(r => r.id === SID)) SID = null;
let ALL = {};            // id học sinh -> { n: {done, stars, best, last, total, tries, at, tasks} }
let DB = null, SYNC = 'local';
try { ALL = JSON.parse(localStorage.getItem('tnxh1-all') || '{}'); } catch (e) { ALL = {}; }
let PROG = SID ? (ALL[SID] = ALL[SID] || {}) : {};
const studentName = (id) => (ROSTER.find(r => r.id === id) || {}).name || '';
function setStudent(id) {
  SID = id; try { id ? localStorage.setItem('tnxh1-sid', id) : localStorage.removeItem('tnxh1-sid'); } catch (e) {}
  PROG = id ? (ALL[id] = ALL[id] || {}) : {};
}
let saving = Promise.resolve();
function save() {
  if (!SID) return;
  try { localStorage.setItem('tnxh1-all', JSON.stringify(ALL)); } catch (e) {}
  if (DB) {

/* ───────── EXPLORE ───────── */
function stageHead(s, step) {

function explore(n) {

/* ───────── QUIZ ───────── */
/* 2 câu từ vựng song ngữ cho mỗi chặng: nối hình với từ tiếng Anh, chọn hình theo từ tiếng Anh */
function vocabQs(n) {
  const W = (WORDS[n] || []).filter(w => w[0]);
  if (W.length < 4) return [];
  const m = shuffle(W).slice(0, 4), p = shuffle(W).slice(0, 3), o = shuffle(p.map(w => w[0]));
  return [
    { t: 'match', vocab: 1, q: 'Nối hình với từ tiếng Anh.', p: m.map(w => [w[0], w[2] + ' (' + w[1] + ')']) },
    { t: 'pick', vocab: 1, q: 'Hình nào là "' + p[0][2] + '"?', say_en: p[0][2], o, a: o.indexOf(p[0][0]) },
  ];
}
let Q = null;
function quiz(n) {
  const s = STAGES[n - 1];
  Q = { n, list: shuffle(s.q.concat(BI ? vocabQs(n) : [])), i: 0, score: 0 };
  ask();
}
function ask() {
  const s = STAGES[Q.n - 1], q = Q.list[Q.i]; REDRAW = ask; window.scrollTo(0, 0);
  app.innerHTML = bar(true) + stageHead(s, 1) +
    `<div class="qtop"><span class="pill">Câu ${Q.i + 1}/${Q.list.length}</span><div class="prog"><i style="width:${Q.i / Q.list.length * 100}%"></i></div><span class="pill">✔ ${Math.round(Q.score * 10) / 10}</span></div>
    <div class="qbox" id="qb"><div class="qtype">${TYPE_NAME[q.t]}</div>
      <div class="qq"><h3>${esc(q.q)}</h3><button class="say" id="say" aria-label="Nghe đọc">🔊</button></div>
      <div id="body"></div><div id="fb"></div></div>`;
  bindBar(app);
  const body = app.querySelector('#body');
  let sayText = q.q;
  const R = RENDER[q.t](q, body);
  if (R && R.say) sayText += '. ' + R.say;
  app.querySelector('#say').onclick = () => q.say_en ? speak(q.say_en, 'en-US') : speak(sayText);
}
function feedback(pts, msg) {
  Q.score += pts;
  const good = pts >= 0.999, part = pts > 0 && !good;
  const fb = app.querySelector('#fb');
  const pics = good ? ['00_4_2', 'Giỏi quá!'] : part ? ['00_4_3', 'Gần đúng rồi!'] : ['00_4_4', 'Chưa đúng rồi!'];
  fb.innerHTML = `<div class="fb ${good ? 'good' : 'bad'} pop"><img src="${src(pics[0])}" alt=""><div class="tx"><h3>${pics[1]}</h3>${msg ? `<p>${msg}</p>` : ''}</div>
    <button class="btn" id="next">${Q.i + 1 < Q.list.length ? 'Câu tiếp →' : 'Xem kết quả →'}</button></div>`;
  if (!good) app.querySelector('#qb').classList.add('shake');
  const nx = fb.querySelector('#next'); nx.focus({ preventScroll: true });
  fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  nx.onclick = () => { Q.i++; Q.i < Q.list.length ? ask() : result(); };
}
const imgTag = (c, cls) => `<img class="${cls || ''}" src="${src(c)}" alt="">`;
function qImage(q) { if (!q.img) return ''; const sq = /^\d\d_\d+_\d+$/.test(q.img) || /^(Mai|Cun)/.test(q.img); return imgTag(q.img, 'qimg' + (sq ? ' sq' : '')); }

const RENDER = {
  mcq(q, el) {
    const ord = shuffle(q.o.map((t, i) => i));
    el.innerHTML = qImage(q) + `<div class="opts txt" style="margin-top:14px">${ord.map((i, k) => `<button class="opt" data-i="${i}"><span class="lt">${LET[k]}</span><span>${bi(q.o[i])}</span></button>`).join('')}</div>`;
    el.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const i = +b.dataset.i; el.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (+x.dataset.i === q.a) x.classList.add('ok'); else if (x !== b) x.classList.add('dim'); });
      if (i !== q.a) b.classList.add('no');
      feedback(i === q.a ? 1 : 0, i === q.a ? '' : 'Đáp án đúng: <b>' + esc(q.o[q.a]) + '</b>');
    });
    return { say: ord.map((i, k) => LET[k] + ': ' + q.o[i]).join('. ') };
  },
  pick(q, el) {
    const ord = shuffle(q.o.map((t, i) => i));
    el.innerHTML = `<div class="opts img">${ord.map(i => `<button class="opt im" data-i="${i}">${imgTag(q.o[i])}</button>`).join('')}</div>`;
    el.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const i = +b.dataset.i; el.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (+x.dataset.i === q.a) x.classList.add('ok'); else if (x !== b) x.classList.add('dim'); });

    });
  },
  tf(q, el) { yesNo(q, el, ['✔', 'Đúng'], ['✘', 'Sai'], 'Đúng', 'Sai'); },
  face(q, el) { yesNo(q, el, ['😊', 'Nên làm'], ['😟', 'Không nên'], 'Nên làm', 'Không nên làm'); },
  sort(q, el) {
    const items = shuffle(q.it); const pick = {};
    el.innerHTML = `<p class="note">Bấm vào tên nhóm dưới mỗi thẻ.</p><div class="sorts">${items.map((it, k) => `<div class="si" data-k="${k}">
      ${isImg(it[0]) ? imgTag(it[0]) : `<div class="tx">${bi(it[0])}</div>`}
      <div class="bins">${q.bins.map((b, j) => `<button data-j="${j}">${bi(b)}</button>`).join('')}</div></div>`).join('')}</div>
      <div class="row" style="margin-top:14px"><button class="btn blue" id="chk" disabled>Kiểm tra</button></div>`;
    const chk = el.querySelector('#chk');
    el.querySelectorAll('.si').forEach(c => c.querySelectorAll('.bins button').forEach(b => b.onclick = () => {
      pick[c.dataset.k] = +b.dataset.j; c.querySelectorAll('.bins button').forEach(x => x.classList.toggle('sel', x === b));
      chk.disabled = Object.keys(pick).length < items.length;
    }));
    chk.onclick = () => {
      let right = 0; chk.disabled = true;
      el.querySelectorAll('.si').forEach(c => {
        const it = items[c.dataset.k], ok = pick[c.dataset.k] === it[1]; if (ok) right++;

    };

  },
  match(q, el) {
    const L = q.p.map((p, i) => ({ i, c: p[0] })), Rr = shuffle(q.p.map((p, i) => ({ i, c: p[1], lab: p[2] })));
    const pair = {}; let cur = null;
    const cell = (o, side) => `<button class="mi" data-side="${side}" data-i="${o.i}">${isImg(o.c) ? imgTag(o.c) : ''}<span class="lab">${isImg(o.c) ? bi(o.lab || '') : bi(o.c)}</span><span class="tag"></span></button>`;
    el.innerHTML = `<p class="note">Bấm một thẻ bên trái, rồi bấm thẻ hợp với nó bên phải.</p>
      <div class="match"><div class="mcol">${L.map(o => cell(o, 'L')).join('')}</div><div class="mcol">${Rr.map(o => cell(o, 'R')).join('')}</div></div>
      <div class="row" style="margin-top:14px"><button class="btn blue" id="chk" disabled>Kiểm tra</button></div>`;
    const chk = el.querySelector('#chk');
    const paint = () => {
      el.querySelectorAll('.mi').forEach(b => { const t = b.querySelector('.tag'); t.textContent = ''; t.style.background = 'transparent'; b.classList.remove('cur'); });
      Object.entries(pair).forEach(([l, r], k) => {
        const idx = L.findIndex(o => o.i == l); const col = PAIRC[idx % PAIRC.length];
        [el.querySelector(`[data-side=L][data-i="${l}"]`), el.querySelector(`[data-side=R][data-i="${r}"]`)].forEach(b => { const t = b.querySelector('.tag'); t.textContent = idx + 1; t.style.background = col; });
      });
      if (cur !== null) el.querySelector(`[data-side=L][data-i="${cur}"]`).classList.add('cur');
      chk.disabled = Object.keys(pair).length < L.length;
    };
    el.querySelectorAll('.mi').forEach(b => b.onclick = () => {
      const i = +b.dataset.i;
      if (b.dataset.side === 'L') { cur = i; delete pair[i]; }
      else if (cur !== null) { Object.keys(pair).forEach(k => { if (pair[k] === i) delete pair[k]; }); pair[cur] = i; cur = null; }
      paint();
    });
    chk.onclick = () => {
      let right = 0; el.querySelectorAll('.mi').forEach(b => b.disabled = true); chk.disabled = true;
      Object.entries(pair).forEach(([l, r]) => { const ok = +l === r; if (ok) right++; el.querySelector(`[data-side=L][data-i="${l}"]`).classList.add(ok ? 'ok' : 'no'); });

  order(q, el) {

    const draw = () => {
      el.innerHTML = `<p class="note">Bấm lần lượt các thẻ theo đúng thứ tự. Bấm vào ô đã xếp để gỡ ra.</p>
        <div class="slots">${q.it.map((_, k) => { const o = put[k]; return `<button class="slot${o ? ' fill' : ''}" data-k="${k}"><span class="n">${k + 1}</span>${o ? show(o.c) : ''}</button>`; }).join('')}</div>
        <div class="pool" style="margin-top:12px">${pool.map(o => `<button data-i="${o.i}" class="${put.includes(o) ? 'used' : ''}">${show(o.c)}</button>`).join('')}</div>
        <div class="row" style="margin-top:14px"><button class="btn blue" id="chk" ${put.filter(Boolean).length < q.it.length ? 'disabled' : ''}>Kiểm tra</button></div>`;
      el.querySelectorAll('.pool button').forEach(b => b.onclick = () => { const o = pool.find(x => x.i == b.dataset.i); const k = [...Array(q.it.length).keys()].find(k => !put[k]); if (k !== undefined) { put[k] = o; draw(); } });
      el.querySelectorAll('.slot').forEach(b => b.onclick = () => { if (put[b.dataset.k]) { put[b.dataset.k] = null; draw(); } });
      el.querySelector('#chk').onclick = () => {
        let right = 0; el.querySelectorAll('.slot').forEach((b, k) => { const ok = put[k].i === k; if (ok) right++; b.classList.add(ok ? 'ok' : 'no'); });
        el.querySelectorAll('button').forEach(b => b.disabled = true);
        feedback(right === q.it.length ? 1 : right / q.it.length * 0.5, right === q.it.length ? '' : 'Thứ tự đúng: ' + q.it.map((c, k) => (k + 1) + (isImg(c) ? '' : ' ' + c)).join(' → ') + (isImg(q.it[0]) ? ' (xem lại phần Em khám phá).' : ''));
      };

    draw();

    el.innerHTML = `<p class="note">Không có đáp án sai. Em chọn ngày cho từng việc để lập bảng trực nhật của tổ.</p>
      <div class="plan">${q.it.map((c, k) => `<div class="si" data-k="${k}">${imgTag(c)}<div class="bins">${q.days.map((d, j) => `<button data-j="${j}">${d.replace('Thứ ', 'T.')}${BI ? `<span class="en" lang="en">${en(d).slice(0, 3)}</span>` : ''}</button>`).join('')}</div></div>`).join('')}</div>
      <div class="row" style="margin-top:14px"><button class="btn blue" id="chk" disabled>Xong, xem bảng</button></div><div id="tb" style="margin-top:12px"></div>`;
    const chk = el.querySelector('#chk');
    el.querySelectorAll('.si').forEach(c => c.querySelectorAll('button').forEach(b => b.onclick = () => {
      pick[c.dataset.k] = +b.dataset.j; c.querySelectorAll('button').forEach(x => x.classList.toggle('sel', x === b)); chk.disabled = Object.keys(pick).length < q.it.length;
    }));
    chk.onclick = () => {
      el.querySelectorAll('button').forEach(b => b.disabled = true);
      el.querySelector('#tb').innerHTML = `<div class="table"><table><tr>${q.days.map(d => `<th>${d}</th>`).join('')}</tr><tr>${q.days.map((d, j) => `<td>${q.it.map((c, k) => pick[k] === j ? imgTag(c) : '').join('')}</td>`).join('')}</tr></table></div>`;
      feedback(1, 'Bảng trực nhật của em đã xong. Hãy cùng tổ thực hiện nhé!');
    };
  },
};
function yesNo(q, el, Y, N, ty, tn) {
  el.innerHTML = qImage(q) + `<div class="two" style="margin-top:14px"><button class="big g" data-v="1"><span class="e">${Y[0]}</span>${bi(Y[1])}</button><button class="big b" data-v="0"><span class="e">${N[0]}</span>${bi(N[1])}</button></div>`;
  el.querySelectorAll('.big').forEach(b => b.onclick = () => {
    const v = b.dataset.v === '1'; el.querySelectorAll('.big').forEach(x => { x.disabled = true; x.classList.add(x === b ? 'sel' : 'dim'); });
    feedback(v === q.a ? 1 : 0, v === q.a ? '' : 'Đáp án đúng: <b>' + (q.a ? ty : tn) + '</b>.');
  });
}

/* ───────── RESULT ───────── */
function result() {
  const s = STAGES[Q.n - 1]; window.scrollTo(0, 0);
  REDRAW = () => explore(Q.n);
  const pct = Q.score / Q.list.length, stars = pct >= .9 ? 3 : pct >= .7 ? 2 : pct >= .5 ? 1 : 0;
  const prev = PROG[Q.n] || {};
  const sc = Math.round(Q.score * 10) / 10;
  PROG[Q.n] = Object.assign({}, prev, { done: !!prev.done || stars > 0, stars: Math.max(stars, prev.stars || 0), best: Math.max(sc, prev.best || 0),
    last: sc, total: Q.list.length, tries: (prev.tries || 0) + 1, at: Date.now(), tasks: prev.tasks || {} });
  ALL[SID] = PROG; save();
  const pass = stars > 0;
  const pr = PROG[Q.n] || { tasks: {} };
  app.innerHTML = bar(true) + stageHead(s, 2) +
    `<section class="res pop"><img class="reward" src="${src(pass ? (s.sticker || s.badge) : '00_4_4')}" alt="">
      <div class="stars">${[0, 1, 2].map(i => `<span class="${i < stars ? '' : 'off'}">★</span>`).join('')}</div>
      <h2>${pass ? (s.star ? 'Em nhận huy hiệu chủ đề ' + topicOf(s.n).name + '!' : 'Em nhận được nhãn dán mới!') : 'Cố lên, thử lại nhé!'}</h2>
      <p style="font-weight:800;font-size:20px">Đúng ${Math.round(Q.score * 10) / 10}/${Q.list.length} câu</p>
      <img src="${src(pass ? '00_3_' + (stars === 3 ? 6 : 4) : '00_3_5')}" alt="" style="width:120px">
    </section>
    <section class="tasks"><h3>Vận dụng: việc em làm ở nhà</h3>
      ${s.tasks.map((t, i) => `<button class="task" data-t="${i}"><span class="bx">${pr.tasks && pr.tasks[i] ? '✔' : ''}</span>${esc(t)}</button>`).join('')}
      <p class="note">Làm xong việc nào, em bấm để đánh dấu.</p></section>
    <div class="row"><button class="btn ghost" data-again>↺ Chơi lại chặng</button>
      ${Q.n < 14 ? `<button class="btn" data-next>Chặng ${Q.n + 1} →</button>` : `<button class="btn" data-home2>Về bản đồ</button>`}</div>`;
  bindBar(app);
  app.querySelectorAll('.task').forEach(b => b.onclick = () => {
    const p = PROG[Q.n] = PROG[Q.n] || { done: false, stars: 0, tasks: {} }; p.tasks = p.tasks || {}; ALL[SID] = PROG;
    p.tasks[b.dataset.t] = !p.tasks[b.dataset.t]; save(); b.querySelector('.bx').textContent = p.tasks[b.dataset.t] ? '✔' : '';
  });
  app.querySelector('[data-again]').onclick = () => explore(Q.n);
  const nx = app.querySelector('[data-next]'); if (nx) nx.onclick = () => explore(Q.n + 1);
  const hm = app.querySelector('[data-home2]'); if (hm) hm.onclick = () => STAGES.every(x => PROG[x.n] && PROG[x.n].done) ? finale() : home();
}

function finale() {
  REDRAW = finale; setTheme(12); window.scrollTo(0, 0);
  app.innerHTML = bar(true) + `<div class="hero final"><img src="${src('00_7')}" alt="Mai giơ cúp vàng, cả nhà vỗ tay"><div class="ttl"><h1>Chúc mừng em!</h1><span class="sub">Em đã đi hết 14 chặng Tự nhiên và Xã hội 1</span></div></div>
    <section class="album"><h2>Huy hiệu chủ đề</h2><div class="stk">${TOPICS.map(t => `<div class="s got" style="width:96px;height:96px"><img style="width:88px;height:88px" src="${src(t.badge)}" alt="${t.name}"></div>`).join('')}</div></section>`;
  bindBar(app);
}

/* ───────── EM LÀ AI? ───────── */
const fold = (t) => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase().trim();
const starsOf = (id) => STAGES.reduce((a, s) => a + (((ALL[id] || {})[s.n] || {}).stars || 0), 0);
const doneOf = (id) => STAGES.filter(s => ((ALL[id] || {})[s.n] || {}).done).length;
function who() {
  REDRAW = who; setTheme(6); window.scrollTo(0, 0);
  const keep = (document.getElementById('who-q') || {}).value || '';
  app.innerHTML = bar(false).replace(/<button class="pill me"[^]*?<\/button>/, '') + `
    <section class="who"><div class="guide"><img src="${src('Mai_di_hoc')}" alt="Mai"><div class="bubble">Chào bạn! Bạn hãy gõ tên của mình, rồi bấm vào đúng tên để bắt đầu nhé.</div></div>
      <h2>Em là ai? <span class="en-t" lang="en" style="font-size:.55em">${BI ? 'Who are you?' : ''}</span></h2>
      <label for="who-q" class="note">Lớp ${CLASS_NAME} · Gõ tên của em (có dấu hay không dấu đều được)</label>
      <input id="who-q" type="text" autocomplete="off" placeholder="Ví dụ: Tuệ Anh" value="${esc(keep)}">
      <div class="names" id="who-list"></div>
      <p class="note">${syncNote()}</p></section>`;
  bindBar(app);
  const inp = app.querySelector('#who-q'), list = app.querySelector('#who-list');
  const draw = () => {
    const q = fold(inp.value);
    const hits = ROSTER.filter(r => !q || fold(r.name).includes(q));
    list.innerHTML = hits.length ? hits.map(r => `<button data-id="${r.id}" class="${r.id === SID ? 'me' : ''}"><span>${esc(r.name)}</span><small>⭐ ${starsOf(r.id)}</small></button>`).join('')
      : '<p class="note">Không tìm thấy tên này. Em gõ lại hoặc nhờ cô giáo giúp nhé.</p>';
    list.querySelectorAll('[data-id]').forEach(b => b.onclick = () => { setStudent(b.dataset.id); home(); });
  };
  inp.oninput = draw; draw();
  if (keep) { inp.focus(); inp.setSelectionRange(keep.length, keep.length); }
}
function syncNote() {
  return SYNC === 'db' ? '✅ Tiến độ được lưu chung cho cả lớp, cô giáo xem được trong Bảng tiến độ.'
    : SYNC === 'wait' ? '⏳ Đang tải tiến độ của cả lớp…'
    : SYNC === 'error' ? '⚠️ Chưa lưu được lên bảng chung, tiến độ tạm lưu trên máy này.'
    : 'Tiến độ đang lưu trên máy này.';
}

/* ───────── BẢNG TIẾN ĐỘ ───────── */
let BSORT = 'list';
function board() {
  REDRAW = board; setTheme(6); window.scrollTo(0, 0);
  const rows = ROSTER.map((r, i) => ({ i: i + 1, id: r.id, name: r.name, st: starsOf(r.id), dn: doneOf(r.id),
    tries: STAGES.reduce((a, s) => a + (((ALL[r.id] || {})[s.n] || {}).tries || 0), 0),
    at: Math.max(0, ...STAGES.map(s => (((ALL[r.id] || {})[s.n] || {}).at || 0))) }));
  if (BSORT === 'stars') rows.sort((a, b) => b.st - a.st || b.dn - a.dn || a.i - b.i);
  const played = rows.filter(r => r.tries > 0).length, sum = rows.reduce((a, r) => a + r.st, 0);
  const cell = (id, n) => { const p = (ALL[id] || {})[n]; if (!p || !p.tries) return '<td class="st0">·</td>';
    return `<td class="${p.stars === 3 ? 'st3' : ''}" title="Lần gần nhất ${p.last}/${p.total} · ${p.tries} lần chơi">${p.stars ? '★'.repeat(p.stars) : '✗'}</td>`; };
  const fmt = (t) => t ? new Date(t).toLocaleString('vi-VN', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '–';
  app.innerHTML = bar(true) + `<section class="board">
    <h2>Bảng tiến độ lớp ${CLASS_NAME} ${BI ? '<span class="en-t" lang="en" style="font-size:.55em">Progress board</span>' : ''}</h2>
    <div class="row"><span class="pill">👧👦 ${played}/${ROSTER.length} bạn đã chơi</span><span class="pill">⭐ ${sum} sao cả lớp</span>
      <button class="pill${BSORT === 'list' ? ' bi-on' : ''}" data-sort="list">Theo danh sách</button><button class="pill${BSORT === 'stars' ? ' bi-on' : ''}" data-sort="stars">Nhiều sao nhất</button></div>
    <p class="note">★ = số sao cao nhất của chặng · ✗ = đã chơi nhưng chưa đạt · · = chưa chơi. Di chuột vào ô để xem điểm lần gần nhất. ${syncNote()}</p>
    <div class="btab"><table><thead><tr><th>STT</th><th class="nm">Họ và tên</th>${STAGES.map(s => `<th class="t-${topicOf(s.n).id}" title="${esc(s.title)}">C${s.n}${s.star ? '★' : ''}</th>`).join('')}<th>Tổng sao</th><th>Số chặng qua</th><th>Lần chơi</th><th>Gần nhất</th></tr></thead>
    <tbody>${rows.map(r => `<tr class="${r.id === SID ? 'mine' : ''}"><td>${r.i}</td><td class="nm">${esc(r.name)}</td>${STAGES.map(s => cell(r.id, s.n)).join('')}<td class="tot">${r.st}</td><td>${r.dn}/14</td><td>${r.tries}</td><td>${fmt(r.at)}</td></tr>`).join('')}</tbody></table></div>
    <p class="note">Tối đa 42 sao (14 chặng × 3 sao). Chặng đạt từ 50% số câu đúng được 1 sao, từ 70% được 2 sao, từ 90% được 3 sao.</p></section>
    <div class="row">${SID ? '<button class="btn" data-home>← Về bản đồ</button>' : '<button class="btn" data-who>Chọn tên để chơi</button>'}</div>`;
  bindBar(app);
  app.querySelectorAll('[data-sort]').forEach(b => b.onclick = () => { BSORT = b.dataset.sort; board(); });
}

home();
</script>

</body></html>
