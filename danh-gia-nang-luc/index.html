<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đánh giá năng lực học sinh · Sổ minh chứng của cô</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#F6F7FB;--card:#fff;--ink:#1D2433;--mute:#667085;--line:#E4E7EC;--main:#2F6FDE;--main-d:#1F4FA8;--soft:#E8F0FD;
--low:#E5484D;--low-s:#FDECEC;--mid:#D99A00;--mid-s:#FFF4D6;--mid2:#2F9E8F;--mid2-s:#E0F5F2;--top:#2E9A4B;--top-s:#E3F5E8;--r:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Be Vietnam Pro',system-ui,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
header{background:linear-gradient(120deg,#1F4FA8,#2F6FDE 60%,#4C8DF0);color:#fff;padding:14px 20px 0}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:20px;letter-spacing:-.2px;margin-right:auto}
.brand small{display:block;font-weight:500;font-size:12.5px;opacity:.85}
.pick{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pick label{font-size:12px;opacity:.85;display:flex;flex-direction:column;gap:2px}
.pick select{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:6px 8px;min-width:110px}
.pick select option{color:#1D2433}
.sync{font-size:12px;background:rgba(255,255,255,.16);border-radius:20px;padding:4px 10px;cursor:pointer;border:0;color:#fff}
nav{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
nav button{background:none;border:0;color:#fff;opacity:.8;padding:10px 14px;border-radius:10px 10px 0 0;cursor:pointer;font-weight:600;white-space:nowrap}
nav button.on{background:var(--bg);color:var(--main-d);opacity:1}
main{padding:18px 20px 60px;max-width:1400px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:0 0 8px}
.mute{color:var(--mute);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{background:var(--main);color:#fff;border:0;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--main-d)}
.btn.ghost{background:var(--soft);color:var(--main-d)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.warn{background:var(--low-s);color:var(--low)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 12px;cursor:pointer;font-size:13px}
.chip.on{background:var(--main);border-color:var(--main);color:#fff}
.lv{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:28px;border-radius:7px;font-weight:700;font-size:12.5px;padding:0 6px}
.lv.low{background:var(--low-s);color:var(--low)}.lv.mid{background:var(--mid-s);color:#9A6B00}.lv.mid2{background:var(--mid2-s);color:#1E7064}.lv.top{background:var(--top-s);color:var(--top)}
.lv.none{background:#F2F4F7;color:#98A2B3;font-weight:500}
.tblw{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff;max-height:72vh}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:middle}
thead th{position:sticky;top:0;background:#F9FAFB;z-index:2;font-size:12.5px;font-weight:700}
.mx td:first-child,.mx th:first-child{position:sticky;left:0;background:#fff;z-index:1;min-width:190px;border-right:1px solid var(--line)}
.mx thead th:first-child{z-index:3;background:#F9FAFB}
.mx th.c{text-align:center;min-width:74px;max-width:110px;font-weight:600;line-height:1.25}
.mx th.c b{display:block;font-size:13px;color:var(--main-d)}
.mx th.c span{display:block;font-weight:500;color:var(--mute);font-size:11px}
.mx td.c{text-align:center;padding:4px}
.cell{border:0;cursor:pointer;min-width:52px;height:34px;border-radius:8px}
.cell.none{background:#F2F4F7;color:#98A2B3}
.cell:hover{outline:2px solid var(--main)}
.mx tr:hover td{background:#FAFBFF}
.mx select{font-size:11px;border:1px solid var(--line);border-radius:6px;margin-top:4px;max-width:100px}
.grid{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:16px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:#F9FAFB;border:1px solid var(--line);border-radius:10px;padding:10px}
.stat .k{font-size:12px;color:var(--mute)}
.stat .v{margin-top:4px}
.tag{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600}
.tag.SUPPORT{background:var(--low-s);color:var(--low)}.tag.PRACTICE{background:var(--mid-s);color:#9A6B00}.tag.CHALLENGE{background:var(--top-s);color:var(--top)}.tag.GAP{background:#EEF0F6;color:#475467}
.ev{display:flex;gap:4px;flex-wrap:wrap}
.ev span{font-size:11.5px;border-radius:6px;padding:1px 6px;border:1px solid var(--line);background:#fff;white-space:nowrap}
.ev span.gv{border-color:#C9DAF8;background:var(--soft)}
.gap{color:var(--low);font-size:12px;font-weight:600}
textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;min-height:150px;resize:vertical;line-height:1.6}
input[type=date],input[type=text],.tc textarea,.tc input{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff}
.tc .it{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;display:grid;grid-template-columns:80px 110px 1fr 70px;gap:8px}
.tc .it .full{grid-column:1/-1}
.tc .it textarea{min-height:52px;font-size:13.5px}
.tc .it label{font-size:11.5px;color:var(--mute);display:flex;flex-direction:column;gap:2px}
.tc .t3{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tc .t3s{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stage{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:3px 0;border-bottom:1px dashed var(--line)}
.stars{color:#F5A524;letter-spacing:1px;white-space:nowrap}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1D2433;color:#fff;padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);align-items:center}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:#F2F4F7;margin-top:6px}
.bar i{display:block;height:100%}
.nx{font-size:13px;color:#344054;max-width:460px}
@media print{header,nav,.noprint,.btn{display:none!important}main{padding:0}.card{border:0;padding:0}.tblw{max-height:none;overflow:visible;border:0}body{background:#fff}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">Sổ đánh giá năng lực<small>Minh chứng quan sát + kết quả app ôn tập · TT27 (Tiểu học) · TT22 (THCS)</small></div>
    <div class="pick">
      <label>Lớp<select id="selCls"></select></label>
      <label>Môn<select id="selSub"></select></label>
      <label>Giai đoạn<select id="selPer"></select></label>
      <button class="sync" id="sync" title="Bấm để tải lại dữ liệu từ Google Sheet">…</button>
    </div>
  </div>
  <nav id="tabs"></nav>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>
<script src="tieu-chi.js"></script>
<script src="lop-va-app.js"></script>
<script src="sheet-config.js" onerror="void 0"></script>
<script src="app.js"></script>
</body>
</html>
