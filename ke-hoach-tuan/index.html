<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Weekly Planner · Kế hoạch tuần</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, practical, a teacher's planner opened every morning and every Friday.
   IDEA: the school "sổ báo giảng": ruled days, hanging times, a red margin line, ticks in the margin.
   PICTURE: the schedule itself (today's timeline, the 7-day board) with progress meters.
   COLOUR and TYPE: white paper, ink blue lead, highlighter yellow support, margin red accent; Be Vietnam Pro.
   LAYOUT: blue rail of 8 sections at left (top tabs on phones), one working column on the right. */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0f1530);--paper:light-dark(#f6f8ff,#161e40);--ink:light-dark(#141a33,#e9ecff);--mute:light-dark(#5a6285,#a3abd3);--blue:light-dark(#1d3fbf,#8fa6ff);--hd:light-dark(#1d3fbf,#17245e);--line:light-dark(#d9e0f5,#2b356a);--red:#d9363e;--redt:light-dark(#b3242c,#ff8a8f);--hi:light-dark(#ffe45c,#e0c23a);--ok:light-dark(#0f7a5c,#5fd3a8);--amber:light-dark(#9a6a00,#f0c060)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Be Vietnam Pro",system-ui,sans-serif;overflow-x:clip}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.rail{background:var(--hd);color:#fff;padding:22px 14px;border-right:6px solid var(--red);position:sticky;top:0;height:100vh;overflow:auto}
.rail h1{font-size:22px;line-height:1.1;margin:0 0 4px;font-weight:800}
.rail .sub{font-size:13px;opacity:.85;margin-bottom:18px}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rail nav a{color:#fff;text-decoration:none;padding:10px 12px;border-radius:10px;font-weight:500;min-height:44px;display:flex;align-items:center;gap:8px;opacity:.85}
.rail nav a.on{background:rgba(255,255,255,.16);opacity:1;font-weight:700;box-shadow:inset 4px 0 0 var(--hi)}
.rail nav a b{margin-left:auto;background:var(--red);color:#fff;border-radius:999px;font-size:12px;padding:0 7px;line-height:20px}
.mode{margin-top:18px;font-size:12px;background:rgba(255,255,255,.12);border-radius:10px;padding:10px}
main{padding:clamp(16px,3vw,34px) max(3vw,14px);max-width:1240px;width:100%}
h2{font-size:clamp(26px,3.4vw,36px);line-height:1.1;margin:0 0 4px;font-weight:800;text-wrap:balance}
h3{font-size:18px;margin:0 0 8px;line-height:1.25}
.lead{color:var(--mute);margin:0 0 18px}
.note{font-size:13px;color:var(--mute)}
a{color:var(--blue)}
input,select,textarea,button{font:inherit;font-size:16px}
input,select,textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-height:44px;width:100%}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--ok);margin:0;flex:none}
textarea{resize:vertical;min-height:70px}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
button{min-height:44px;padding:0 16px;border-radius:10px;border:2px solid var(--blue);background:var(--blue);color:light-dark(#fff,#0f1530);font-weight:600;cursor:pointer;white-space:nowrap}
button.ghost{background:transparent;color:var(--blue)}
button.sm{min-height:36px;padding:0 12px;font-size:14px}
button.warn{border-color:var(--red);background:var(--red);color:#fff}
button.link{border:0;background:none;color:var(--mute);min-height:32px;padding:0 6px;font-size:13px;text-decoration:underline;font-weight:500}
button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{flex:1}
.banner{background:var(--hi);color:#141a33;border-radius:12px;padding:12px 14px;margin:0 0 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.banner p{margin:0;flex:1 1 260px}
.banner button{border-color:#141a33;background:#141a33;color:#fff}
.banner button.ghost{background:transparent;color:#141a33}
.banner.bad{background:light-dark(#ffe1e2,#4a1518);color:var(--ink)}.banner.bad button{border-color:var(--red);background:var(--red)}
.banner.calm{background:var(--paper);color:var(--ink);border:1px solid var(--line)}.banner.calm button{border-color:var(--blue);background:var(--blue);color:light-dark(#fff,#0f1530)}
.kpi{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:0 0 18px}
.kpi div{background:var(--paper);border-radius:12px;padding:12px 14px;border-top:4px solid var(--line)}
.kpi b{display:block;font-size:clamp(24px,3.2vw,34px);line-height:1.1;color:var(--blue);font-weight:800}
.kpi span{font-size:13px;color:var(--mute)}
.kpi .r{border-top-color:var(--red)}.kpi .r b{color:var(--redt)}.kpi .y{border-top-color:var(--hi)}.kpi .g{border-top-color:var(--ok)}.kpi .g b{color:var(--ok)}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px}
.panel{background:var(--paper);border-radius:14px;padding:16px;border-left:4px solid var(--red);margin-bottom:18px}
.meter{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);transition:width .3s}
.bars .r{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 110px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.bars .r:last-child{border-bottom:0}
.bars .b{height:14px;background:var(--line);border-radius:7px;overflow:hidden;display:flex}.bars .b i{display:block;height:100%}
.bars .n{text-align:right;font-weight:600;white-space:nowrap;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.tl{list-style:none;margin:0;padding:0}
.it{display:grid;grid-template-columns:92px 28px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:0}
.tm{font-weight:800;color:var(--blue);white-space:nowrap;font-size:15px;line-height:1.3}.tm small{display:block;font-weight:500;color:var(--mute);font-size:12px}
.ti{font-weight:600;line-height:1.35;cursor:pointer}.ti:hover{text-decoration:underline}
.st{font-size:14px;color:var(--mute)}
.done .ti,.done .st{text-decoration:line-through;opacity:.6}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:0 6px;margin:0 0 0 4px;font-weight:600;vertical-align:1px;white-space:nowrap;line-height:20px}
.t-ro{background:var(--hi);color:#141a33}.t-od{background:var(--red);color:#fff}.t-cf{background:light-dark(#ffe1e2,#5a1d22);color:var(--redt);border:1px solid var(--red)}.t-lk{background:var(--line);color:var(--ink)}
.t-cao{color:var(--redt);border:1px solid currentColor}.t-tb{color:var(--amber);border:1px solid currentColor}.t-thap{color:var(--mute);border:1px solid currentColor}
.empty{color:var(--mute);font-size:14px;padding:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;min-height:36px;background:var(--bg);color:var(--ink);font-size:14px;font-weight:500}
.chip.off{opacity:.4}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.col{background:var(--paper);border-radius:12px;padding:10px;border-top:4px solid var(--line);min-height:160px}
.col.today{border-top-color:var(--red);box-shadow:0 0 0 2px var(--red) inset}
.col.off{opacity:.6}
.col h4{margin:0;font-size:15px}.col .cap{font-size:12px;color:var(--mute);margin:2px 0 6px}
.col .meter{height:6px;margin-bottom:8px}.col .meter i{background:var(--blue)}
.card{background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;padding:6px 8px;margin-bottom:6px;font-size:13px;line-height:1.35;cursor:pointer;display:block;width:100%;text-align:left;color:var(--ink);font-weight:500;white-space:normal;min-height:0}
.card b{display:block;font-size:12px;color:var(--mute);font-weight:600}
.card.cf{outline:2px solid var(--red)}
.card.done{opacity:.55;text-decoration:line-through}
.col .add{width:100%;min-height:36px;font-size:13px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.tbl th{font-size:13px;color:var(--mute);font-weight:600;white-space:nowrap}
.tbl td.n{text-align:right;white-space:nowrap}
.tbl tr.done td{opacity:.6}
.scroll{overflow-x:auto}
.f4{display:grid;grid-template-columns:minmax(0,2fr) repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.form label,.lbl{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:3px}
.form .w2{grid-column:span 2}.form .w4{grid-column:1/-1}
.mt{background:var(--paper);border-radius:12px;padding:14px;margin-bottom:12px;border-left:4px solid var(--blue)}
.mt summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:minmax(0,1fr) 160px;gap:12px;align-items:center}
.mt summary::-webkit-details-marker{display:none}
.mt .sub{font-size:13px;color:var(--mute)}
.ws{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--paper);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.sw{display:flex;gap:4px;flex-wrap:wrap}.sw button{width:30px;height:30px;min-height:0;padding:0;border-radius:50%;border:3px solid transparent}.sw button.on{border-color:var(--ink)}
.seg{display:inline-flex;border:2px solid var(--blue);border-radius:10px;overflow:hidden}.seg button{border:0;border-radius:0;background:transparent;color:var(--blue)}.seg button.on{background:var(--blue);color:light-dark(#fff,#0f1530)}
.out{white-space:pre-wrap;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:14px;max-height:420px;overflow:auto;margin:0}
.log{list-style:none;padding:0;margin:0;font-size:14px}.log li{padding:6px 0;border-bottom:1px solid var(--line)}.log li b{color:var(--blue)}
dialog{border:0;border-radius:16px;padding:0;width:min(760px,94vw);max-height:90vh;background:var(--bg);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,15,40,.5)}
.dh{background:var(--hd);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px;border-bottom:4px solid var(--red)}
.dh h3{margin:0;flex:1;color:#fff}.dh button{background:transparent;border-color:rgba(255,255,255,.6);color:#fff}
.db{padding:16px 18px;overflow:auto;max-height:calc(90vh - 140px)}
.df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.grp{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.grp h4{margin:0 0 6px;font-size:15px;display:flex;gap:8px;align-items:center}
.grp .k{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-weight:800;font-size:13px;color:#fff;flex:none}
.prop{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;padding:6px 0;border-top:1px dashed var(--line);font-size:14px}
.prop .why{color:var(--mute);font-size:13px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99;max-width:90vw}
.toast.on{opacity:1}
.hide{display:none!important}
@media(max-width:1100px){.week{grid-template-columns:repeat(4,minmax(0,1fr))}.kpi{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:860px){.app{grid-template-columns:1fr}.rail{position:sticky;height:auto;border-right:0;border-bottom:5px solid var(--red);padding:12px 12px 8px;z-index:20}.rail .sub,.rail .mode{display:none}.rail h1{font-size:18px;margin-bottom:8px}.rail nav{flex-direction:row;overflow-x:auto;scroll-snap-type:x proximity}.rail nav a{flex:none;padding:8px 10px}.grid2{grid-template-columns:1fr}.form{grid-template-columns:1fr 1fr}.f4{grid-template-columns:1fr 1fr}.f4>:first-child{grid-column:1/-1}}
@media(max-width:600px){.week{grid-template-columns:1fr}.kpi{grid-template-columns:1fr 1fr}.it{grid-template-columns:88px 26px minmax(0,1fr)}.tm{font-size:13px}.it .act{grid-column:3}.bars .r{grid-template-columns:minmax(0,1fr) 100px}.bars .b{grid-column:1/-1;grid-row:2}.form .w2{grid-column:1/-1}.mt summary{grid-template-columns:1fr}
 .stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:2px 0;padding-inline-start:7.5em;text-align:start}.stack td.n{text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7em;margin-inline-start:-7.5em;color:var(--mute);font-size:12px}.stack td:empty{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<div class="app">
<aside class="rail">
  <h1>AI Weekly Planner</h1>
  <div class="sub">Kế hoạch tuần · lưu trên máy này</div>
  <nav id="nav">
    <a href="#tong-quan" data-v="tong-quan">Tổng quan</a>
    <a href="#hom-nay" data-v="hom-nay">Hôm nay</a>
    <a href="#ke-hoach-tuan" data-v="ke-hoach-tuan">Kế hoạch tuần</a>
    <a href="#luong-cong-viec" data-v="luong-cong-viec">Luồng công việc</a>
    <a href="#nhiem-vu-chinh" data-v="nhiem-vu-chinh">Nhiệm vụ chính</a>
    <a href="#tat-ca" data-v="tat-ca">Tất cả công việc</a>
    <a href="#bao-cao" data-v="bao-cao">Báo cáo</a>
    <a href="#cai-dat" data-v="cai-dat">Cài đặt</a>
  </nav>
  <div class="mode" id="modeBox"></div>
</aside>
<main>
  <div id="banners"></div>
  <section id="view"></section>
</main>
</div>

<dialog id="dlg"><form method="dialog" id="dlgForm"><div class="dh"><h3 id="dlgT"></h3><button value="cancel" class="sm" aria-label="Đóng">Đóng</button></div><div class="db" id="dlgB"></div><div class="df" id="dlgF"></div></form></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
{
/* ================= helpers ================= */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const DN=['T2','T3','T4','T5','T6','T7','CN'],DL=['Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy','Chủ Nhật'];
const COLS=['#1d3fbf','#0f8a7a','#d9363e','#c98a00','#7a3fc0','#c0397a','#3a7d1f','#5a6285'];
const PR={cao:{l:'Cao',w:3},tb:{l:'Trung bình',w:2},thap:{l:'Thấp',w:1}};
const ST={todo:'Chưa làm',doing:'Đang làm',done:'Hoàn thành'};
const REASONS=['Quá hạn, chưa làm kịp','Phát sinh việc đột xuất','Chờ thông tin, chờ người khác','Ốm, nghỉ, vắng mặt','Ưu tiên việc khác','Khác'];
const toMin=t=>{if(!t)return 0;const [h,m]=String(t).split(':').map(Number);return (h||0)*60+(m||0)};
const hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=k=>{const [y,m,d]=String(k).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const addD=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return iso(d)};
const monOf=k=>{const d=parse(k);d.setDate(d.getDate()-(d.getDay()+6)%7);return iso(d)};
const dow=k=>(parse(k).getDay()+6)%7;
const vn=k=>k?String(parse(k).getDate()).padStart(2,'0')+'/'+String(parse(k).getMonth()+1).padStart(2,'0'):'—';
const vnf=k=>k?vn(k)+'/'+parse(k).getFullYear():'—';
const dayLbl=k=>DN[dow(k)]+' '+vn(k);
const hrs=m=>(Math.round(m/6)/10).toLocaleString('vi-VN')+' giờ';
const r15=m=>Math.max(15,Math.round(m/15)*15);
const validD=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'');
const validT=s=>/^\d{2}:\d{2}$/.test(s||'');
let NOWD=new Date();
const today=()=>iso(NOWD),nowMin=()=>NOWD.getHours()*60+NOWD.getMinutes();
const curWk=()=>monOf(today());
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2600)}
const endM=t=>toMin(t.start)+(+t.dur||0);

/* ================= storage (local-first) ================= */
const K={tasks:'ai_weekly_planner_tasks_v1',init:'ai_weekly_planner_initialized_v1',bk:'ai_weekly_planner_tasks_backup_v1',set:'ai_weekly_planner_settings_v1',ws:'ai_weekly_planner_workstreams_v1',mt:'ai_weekly_planner_master_tasks_v1',hist:'ai_weekly_planner_plan_history_v1'};
const OLD='ke-hoach-tuan-v1';
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){localStorage.setItem(k,v)},ok(){try{localStorage.setItem('__t','1');localStorage.removeItem('__t');return true}catch(e){return false}}};
const defSet=()=>({name:'',w1:'2026-08-10',days:[1,1,1,1,1,1,0],ses:[{s:'07:30',e:'11:00',on:1},{s:'13:30',e:'17:00',on:1},{s:'19:30',e:'21:30',on:0}],max:90,autoWeek:1,autoApply:0,nextWeek:1});
let MODE='SAMPLE',D=null,PROBLEMS=[];
function readKey(k,check){const raw=LS.get(k);if(raw==null)return{miss:1};try{const v=JSON.parse(raw);if(check&&!check(v))return{bad:1};return{v}}catch(e){return{bad:1}}}
function load(){
  if(!LS.get(K.init)){D=sampleData();MODE='SAMPLE';return}
  MODE='USER';PROBLEMS=[];
  const spec=[['tasks',K.tasks,Array.isArray,[]],['ws',K.ws,Array.isArray,[]],['mt',K.mt,Array.isArray,[]],['set',K.set,v=>v&&typeof v==='object'&&Array.isArray(v.days),defSet()],['hist',K.hist,v=>v&&Array.isArray(v.events),{events:[],weeks:{}}]];
  D={};spec.forEach(([n,k,c,def])=>{const r=readKey(k,c);if(r.v!==undefined)D[n]=r.v;else{D[n]=JSON.parse(JSON.stringify(def));PROBLEMS.push({n,k,why:r.miss?'bị thiếu':'bị hỏng'})}});
  D.set={...defSet(),...D.set};D.hist.weeks=D.hist.weeks||{};
  if(PROBLEMS.length)MODE='RECOVERY';
}
function persist(){
  if(MODE==='RECOVERY'){toast('Dữ liệu đang cần khôi phục, chưa lưu thay đổi');return false}
  if(MODE==='SAMPLE')MODE='USER';
  if(!LS.get(K.init)){try{LS.set(K.init,new Date().toISOString())}catch(e){}}
  try{
    LS.set(K.tasks,JSON.stringify(D.tasks));LS.set(K.ws,JSON.stringify(D.ws));LS.set(K.mt,JSON.stringify(D.mt));LS.set(K.set,JSON.stringify(D.set));LS.set(K.hist,JSON.stringify(D.hist));
    const day=today();if(D.hist.lastAuto!==day){D.hist.lastAuto=day;LS.set(K.hist,JSON.stringify(D.hist));snapshot('Tự động hằng ngày')}
    if(!drSilent)drQueue();
    return true;
  }catch(e){toast('Không lưu được: bộ nhớ trình duyệt đầy hoặc bị chặn');return false}
}
function backups(){const r=readKey(K.bk,Array.isArray);return r.v||[]}

/* ================= Google Drive sync (Apps Script web app of the user) ================= */
const DK='ai_weekly_planner_drive_v1';
let DR={};try{DR=JSON.parse(LS.get(DK))||{}}catch(e){DR={}}

const perList=m=>String(m.per||'').split(/[,;\n]/).map(x=>x.trim()).filter(Boolean);
const occ=m=>perList(m).length||Math.max(1,Math.round(+m.n||1));
function steps(m){
  const n=occ(m),tot=r15((+m.h||0)*60/n);
  const lines=String(m.steps||'').split('\n').map(s=>s.trim()).filter(Boolean);
  if(lines.length){
    const ps=lines.map(l=>{const x=l.match(/^(.*?)\s*\|\s*(\d+)\s*(p|ph|phút)?\s*$/i);return x?{t:x[1],m:r15(+x[2])}:{t:l,m:0}});
    const fx=ps.reduce((a,p)=>a+p.m,0),fr=ps.filter(p=>!p.m).length;
    ps.forEach(p=>{if(!p.m)p.m=r15(Math.max(15,(tot-fx)/Math.max(1,fr)))});return ps;
  }
  const tp=TPL.find(([re])=>re.test(m.title));
  if((m.day>=0&&m.time)||!tp||tot<45)return[{t:'',m:tot}];
  let tl=tp[1];const k=Math.max(1,Math.min(tl.length,Math.floor(tot/30)));
  if(k<tl.length){const g=[];tl.forEach((x,i)=>{const j=Math.floor(i*k/tl.length);g[j]=g[j]?[g[j][0]+'; '+x[0].charAt(0).toLowerCase()+x[0].slice(1),g[j][1]+x[1]]:[x[0],x[1]]});tl=g}
  if(tl.length===1)return[{t:'',m:tot}];
  const ss=tl.map(([s,w])=>({t:s,m:r15(tot*w)}));
  const diff=tot-ss.reduce((a,s)=>a+s.m,0);ss[ss.length-1].m=Math.max(15,ss[ss.length-1].m+diff);
  return ss;
}

/* ================= scheduling engine ================= */
const INF=1e9;
function cutoff(date){const t=today();if(date<t)return INF;if(date>t)return 0;return Math.ceil(nowMin()/15)*15}
function board(tasks){const b={};tasks.forEach(t=>{if(validD(t.date)&&validT(t.start))(b[t.date]=b[t.date]||[]).push([toMin(t.start),endM(t)])});return b}
function freeOn(b,date,from){
  if(!D.set.days[dow(date)])return[];
  const c=Math.max(from||0,cutoff(date));if(c>=INF)return[];
  const busy=b[date]||[],out=[];
  D.set.ses.filter(s=>s.on).map(s=>[toMin(s.s),toMin(s.e)]).sort((a,b)=>a[0]-b[0]).forEach(([a,z])=>{
    let segs=[[Math.max(a,c),z]];
    busy.forEach(([x,y])=>{segs=segs.flatMap(([p,q])=>y<=p||x>=q?[[p,q]]:[[p,x],[y,q]].filter(([u,v])=>v>u))});
    out.push(...segs.filter(([p,q])=>q>p));
  });return out;
}
function capacity(date){if(!D.set.days[dow(date)])return 0;return D.set.ses.filter(s=>s.on).reduce((a,s)=>a+Math.max(0,toMin(s.e)-toMin(s.s)),0)}
function findSlot(b,m,dates,fromDate,fromMin,pref){
  const tryD=(d,f)=>{const x=freeOn(b,d,f).find(([p,q])=>q-p>=m);return x?{date:d,start:hm(x[0])}:null};
  if(pref&&dates.includes(pref)){const r=tryD(pref,pref===fromDate?fromMin:0);if(r)return r}
  const i0=Math.max(0,dates.indexOf(fromDate));
  for(let i=i0;i<dates.length;i++){const r=tryD(dates[i],i===i0?fromMin:0);if(r)return r}
  for(let i=0;i<i0;i++){const r=tryD(dates[i],0);if(r)return r}
  return null;
}
const occupy=(b,s)=>{(b[s.date]=b[s.date]||[]).push([toMin(s.start),toMin(s.start)+s.m])};
function conflicts(tasks){
  const ids=new Set(),by={};
  tasks.forEach(t=>{if(validD(t.date)&&validT(t.start))(by[t.date]=by[t.date]||[]).push(t)});
  Object.values(by).forEach(a=>{a.sort((x,y)=>toMin(x.start)-toMin(y.start));for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length&&toMin(a[j].start)<endM(a[i]);j++){ids.add(a[i].id);ids.add(a[j].id)}});
  return ids;
}
const isOver=t=>t.status!=='done'&&((validD(t.date)&&(t.date<today()||(t.date===today()&&validT(t.start)&&endM(t)<=nowMin())))||(validD(t.deadline)&&t.deadline<today()));
const isUnsched=t=>t.status!=='done'&&(!validD(t.date)||!validT(t.start));
const weekDates=wk=>[0,1,2,3,4,5,6].map(i=>addD(wk,i));
const prioCmp=(a,b)=>(PR[b.priority]?.w||0)-(PR[a.priority]?.w||0)||String(a.deadline||'9').localeCompare(String(b.deadline||'9'));

/* Plan proposal. Minimal disruption: only tasks that must change are touched.
   A = proposed change, B = cannot place yet, C = valid unchanged, D = completed (locked) */
function buildPlan(wk,o){
  o=o||{gen:1,fix:1};
  const dates=weekDates(wk),cw=curWk(),isCur=wk===cw,past=wk<cw;
  const all=D.tasks,A=[],B=[];const touched=new Set();
  if(past)return{wk,A,B,C:all.filter(t=>t.date>=wk&&t.date<=dates[6]&&t.status!=='done'),D:all.filter(t=>t.date>=wk&&t.date<=dates[6]&&t.status==='done'),past:1};
  const span=D.set.nextWeek?dates.concat(weekDates(addD(wk,7))):dates;
  const fromDate=isCur?today():wk;
  const adds=[];
  if(o.gen){
    const mids=new Set(D.mt.map(m=>m.id));
    all.forEach(t=>{if(t.gen&&t.gen.wk===wk&&t.status!=='done'&&!mids.has(t.mtId)){A.push({kind:'remove',task:t,why:'Nhiệm vụ chính đã bị xoá'});touched.add(t.id)}});
    D.mt.forEach(m=>{
      if(m.mode==='m')return;
      const s=mSig(m),mine=all.filter(t=>t.mtId===m.id&&t.gen);
      if(m.mode==='w'&&wk<(m.startWeek||wk))return;
      if(m.mode==='o'){const here=mine.filter(t=>t.gen.wk===wk);if(mine.length&&!here.length)return;if(wk<(m.startWeek||wk))return}
      const here=mine.filter(t=>t.gen.wk===wk);
      if(here.length&&here.every(t=>t.gen.sig===s))return;
      const keep=new Set();
      here.forEach(t=>{if(t.status==='done'||t.gen.sig===s)keep.add(t.gen.key);else{A.push({kind:'remove',task:t,why:'Nhiệm vụ chính đã thay đổi'});touched.add(t.id)}});
      adds.push({m,s,keep});
    });
  }
  const movers=[];
  if(o.fix){
    const cf=conflicts(all.filter(t=>!touched.has(t.id)&&t.date>=wk&&t.date<=dates[6]));
    all.forEach(t=>{
      if(touched.has(t.id)||t.status==='done'||t.fixed)return;
      if(isCur&&validD(t.date)&&isOver(t)&&t.date<=today()&&!(t.deadline<today()&&t.date>today())){movers.push({t,why:'Quá hạn, chưa hoàn thành',ro:1});touched.add(t.id);return}
      if(isUnsched(t)&&(!validD(t.date)||(t.date>=fromDate&&t.date<=dates[6]))){movers.push({t,why:'Chưa được xếp lịch',pref:validD(t.date)?t.date:''});touched.add(t.id)}
    });
    // conflicts: keep higher priority / earlier created, move the other
    const byD={};all.filter(t=>cf.has(t.id)&&!touched.has(t.id)).forEach(t=>(byD[t.date]=byD[t.date]||[]).push(t));
    Object.values(byD).forEach(a=>{a.sort((x,y)=>(x.status==='done'?-1:0)-(y.status==='done'?-1:0)||toMin(x.start)-toMin(y.start));const kept=[];
      a.forEach(t=>{const clash=kept.some(k=>toMin(t.start)<endM(k)&&toMin(k.start)<endM(t));if(clash&&t.status!=='done'&&!t.fixed&&!(t.mtId&&D.mt.find(m=>m.id===t.mtId&&m.time))){movers.push({t,why:'Trùng giờ với việc khác'});touched.add(t.id)}else kept.push(t)})});
  }
  const b=board(all.filter(t=>!touched.has(t.id)));
  movers.sort((x,y)=>prioCmp(x.t,y.t)).forEach(mv=>{
    const t=mv.t,m=+t.dur||30;
    const s=findSlot(b,m,span,fromDate,0,mv.pref);
    const from={date:t.date||'',start:t.start||''};

  });

[2,3],"Nước và Tính chất của nước ( t2) + Dự án 2: Sơ đồ tư duy 3D vòng tuần hoàn nước - Khám phá và Thiết kế","Giải thích hiện tượng mao dẫn của nước. – Hoàn thành thử thách : \"Dẫn nước qua ao\" - Quan sát hiện tượng ngưng tụ của hơi nước nóng khi gặp đĩa lạnh. – - Thảo luận về 3 thể của nước, cách tự làm đá lạnh an toàn tại nhà và hoàn thành PHT 1. – - Thiết kế và vẽ p","Phiếu học tập – Đánh giá quá trình hoạt động trên lớp – Sản phẩm dự án - Đánh giá qua kết quả Phiếu học tập 1 (Nhật ký thực nghiệm) và Phiếu học tập 2 (Bản thiết kế). – - Quan sát mức độ tích cực tham",""],

[13,14],"DỰ ÁN 7: BÓNG TỐI VÀ ỨNG DỤNG (RẠP HÁT BÓNG - SHADOW THEATER)","Lựa chọn vật liệu: Tìm hiểu và chọn vật liệu phù hợp (làm màn chiếu) để ánh sáng có thể truyền qua một phần. – Thiết kế và Chế tạo: Vẽ bản phác thảo cấu trúc và chế tạo rạp hát từ hộp carton. – Xây dựng nội dung: Lên kịch bản (đặt tên vở kịch, liệt kê nhân vật","Độ chắc chắn: Khung hộp carton phải chắc chắn, tự đứng được. – Chất lượng màn chiếu: Giấy nến phải được căng thẳng, không bị nhăn nhúm. – Độ hoàn thiện của con rối: Que cầm rối phải được dán dính chặt",""],

function bgState(x){
  const mv=bgAll().find(y=>y.k===x.k&&y.w>x.w&&new RegExp('dời từ tuần\\s*'+x.w+'\\b','i').test(y.gc));
  if(mv&&!x.bai)return{off:1,s:`Nghỉ, dời sang ${vn(mv.date)}`};
  if(!x.bai)return{gap:1,s:'Báo giảng chưa ghi nội dung'};
  const t=D.tasks.find(t=>t.title.startsWith('Dạy '+x.k)&&(t.date===x.date||t.originalDate===x.date));
  return t?{t,s:t.status==='done'?'Đã dạy (đã tick)':'Chưa tick hoàn thành'}:{s:'Theo báo giảng'};
}
const bgProj=s=>{const m=s.match(/(DỰ ÁN|Dự án)\s*0?(\d+)/);return m?'Dự án '+m[2]:''};
function bgReport(a0,a1){
  const L=bgAll().filter(x=>x.date>=a0&&x.date<=a1).map(x=>({...x,st:bgState(x)}));
  const ks=[...new Set(bgAll().map(x=>x.k))];
  const cls=ks.map(k=>{const mine=L.filter(x=>x.k===k),done=mine.filter(x=>!x.st.off&&!x.st.gap),upto=bgAll().filter(x=>x.k===k&&x.date<=a1&&x.pp.length);
    const last=upto.length?upto[upto.length-1].pp.slice(-1)[0]:0,proj=[...new Set(done.map(x=>bgProj(x.bai)).filter(Boolean))];
    return{k,n:mine.length,ti:done.reduce((s,x)=>s+x.p.length,0),last,proj,off:mine.filter(x=>x.st.off).length,gap:mine.filter(x=>x.st.gap).length,
      tot:bgAll().filter(x=>x.k===k&&x.date<=a1&&x.bai).reduce((s,x)=>s+x.p.length,0)}}).filter(c=>c.n);
  const warn=[];
  ks.forEach(k=>{let prev=null;bgAll().filter(x=>x.k===k).forEach(x=>{const inP=x.date>=a0&&x.date<=a1;
    if(x.pp.length&&prev){const want=prev+1;if(inP&&x.pp[0]!==want)warn.push(`${k} ${vn(x.date)}: tiết PPCT ghi ${x.pp.join(', ')}, tiết trước là ${prev}`)}
    for(let i=1;i<x.pp.length;i++)if(inP&&x.pp[i]!==x.pp[i-1]+1)warn.push(`${k} ${vn(x.date)}: tiết PPCT ${x.pp[i-1]} rồi ${x.pp[i]}`);
    if(x.pp.length)prev=x.pp[x.pp.length-1]})});
  L.filter(x=>x.st.gap).forEach(x=>warn.push(`${x.k} ${vn(x.date)}: ${x.st.s}`));
  return{L,cls,warn,ti:cls.reduce((s,c)=>s+c.ti,0)};
}

    let ws=D.ws.find(w=>w.name.toLowerCase()===wsName.toLowerCase());if(!ws){ws={id:uid(),name:wsName,col:COLS[D.ws.length%COLS.length]};D.ws.push(ws)}
    const t={id:uid(),title,wsId:ws.id,mtId:'',date,start:'',dur,deadline:date,priority:'tb',status:'done',note:note+'Minh chứng: '+PJ16.base+path+' · thời lượng ước tính',rolloverCount:0,originalDate:date,originalDeadline:date,src:PJ16.src,completedAt:date+'T'+end+':00',createdAt:new Date().toISOString()};
    D.tasks.push(t);logE({type:'done',taskId:t.id,title,reason:'Dự án đã làm tuần 16 (đưa vào báo cáo)'});n++});
  D.hist.proj16=1;
  if(n)logE({type:'import',src:PJ16.src,reason:`Thêm ${n} dự án đã làm trong tuần 16 vào báo cáo`});
  if(!inline&&MODE==='USER')persist();
  return n;
}
/* Cô báo 26/11: báo giảng tuần 17 đã xong, chỉ còn báo cáo tuần 16. Chạy một lần trên dữ liệu đã gắn nội dung. */
function nd16Fix(inline){
  if(MODE==='RECOVERY'||!D.hist||D.hist.nd16b)return 0;
  if(!D.tasks.some(t=>t.src===ND16.src||t.src===TKB16.src))return 0;
  let n=0;const now=new Date().toISOString();
  D.tasks=D.tasks.filter(t=>{if(t.src===ND16.src&&/^Ghi nội dung học tập tuần 17/.test(t.title)&&t.status!=='done'){logE({type:'remove',taskId:t.id,title:t.title,reason:'Báo giảng tuần 17 cô đã làm xong'});n++;return false}return true});
  D.tasks.forEach(t=>{
    if(/file chưa có nội dung tuần 17/.test(t.note||'')){t.note='Cho tuần 17 · theo báo giảng tuần 17';n++}
    if(t.src===TKB16.src&&/^Báo giảng, sổ đầu bài tuần 16/.test(t.title)&&t.status!=='done'){t.status='done';t.completedAt=now;t.note='Đã làm báo giảng tuần 17';logE({type:'done',taskId:t.id,title:t.title,reason:'Cô báo đã xong báo giảng tuần 17'});n++}
  });
  D.hist.nd16b=1;
  if(!inline&&MODE==='USER')persist();
  return n;
}
function importData(txt){
  let x;try{x=JSON.parse(txt)}catch(e){toast('File không đúng định dạng JSON');return}
  const d=x&&x.data?x.data:x;
  if(!d||!Array.isArray(d.tasks)||!Array.isArray(d.ws)){toast('Không phải bản sao lưu của AI Weekly Planner');return}
  if(MODE!=='SAMPLE')snapshot('Trước khi nhập dữ liệu');
  D={tasks:d.tasks,ws:d.ws,mt:Array.isArray(d.mt)?d.mt:[],set:{...defSet(),...(d.set||{})},hist:d.hist&&Array.isArray(d.hist.events)?{weeks:{},...d.hist}:{events:[],weeks:{}}};
  MODE='USER';PROBLEMS=[];logE({type:'import',reason:'Nhập bản sao lưu'});commit('Đã nhập dữ liệu');
}
function restore(id){
  const s=backups().find(b=>b.id===id);if(!s){toast('Không tìm thấy bản sao lưu');return}
  const wasRec=MODE==='RECOVERY';if(!wasRec&&MODE!=='SAMPLE')snapshot('Trước khi khôi phục');
  D={...s.data,set:{...defSet(),...s.data.set},hist:{weeks:{},...s.data.hist}};MODE='USER';PROBLEMS=[];logE({type:'restore',reason:'Khôi phục bản '+s.at});commit('Đã khôi phục');
}
function migrateOld(){
  let o;try{o=JSON.parse(LS.get(OLD))}catch(e){}if(!o||!o.streams){toast('Không đọc được dữ liệu bản cũ');return}
  if(MODE!=='SAMPLE')snapshot('Trước khi nhập dữ liệu bản cũ');
  if(MODE==='SAMPLE'){D={tasks:[],ws:[],mt:[],set:defSet(),hist:{events:[],weeks:{}}}}
  o.streams.forEach(s=>{if(!D.ws.find(w=>w.id===s.id))D.ws.push({id:s.id,name:s.name,col:s.col||COLS[0]});(s.tasks||[]).forEach(t=>{if(!D.mt.find(m=>m.id===t.id))D.mt.push({id:t.id,title:t.title,wsId:s.id,priority:'tb',deadline:'',desc:'',mode:t.rep==='o'?'o':'w',h:t.h,n:t.n,per:t.per||'',day:+t.day,time:t.time||'',steps:t.steps||'',startWeek:t.wk||curWk(),createdAt:new Date().toISOString()})})});
  if(o.cfg){D.set={...D.set,name:o.cfg.name||D.set.name,w1:o.cfg.w1||D.set.w1,days:o.cfg.days||D.set.days,ses:o.cfg.ses||D.set.ses,max:o.cfg.max||D.set.max}}
  let n=0;Object.entries(o.weeks||{}).forEach(([wk,W])=>(W.items||[]).forEach(i=>{if(i.mv)return;const date=i.d>=0?addD(wk,i.d):'';D.tasks.push({id:'o'+i.id,title:i.t,wsId:i.sid,mtId:i.man?'':i.tid,date,start:i.d>=0?hm(i.s):'',dur:i.m,deadline:addD(wk,6),priority:'tb',status:i.done?'done':'todo',note:i.st||'',rolloverCount:i.c?1:0,originalDate:date,originalDeadline:addD(wk,6),gen:i.man?undefined:{wk,key:i.k,sig:'migrated'},completedAt:i.done?new Date(i.at||Date.now()).toISOString():undefined,createdAt:new Date().toISOString()});n++}));
  Object.keys(o.weeks||{}).forEach(wk=>D.hist.weeks[wk]={at:new Date().toISOString()});
  MODE=MODE==='SAMPLE'?'SAMPLE':MODE;logE({type:'import',reason:`Nhập ${n} việc từ bản cũ`});commit(`Đã nhập ${n} việc từ bản cũ`);
}
function integrity(){
  const out=[],ids=new Set(),wsIds=new Set(D.ws.map(w=>w.id)),mtIds=new Set(D.mt.map(m=>m.id));
  D.tasks.forEach(t=>{
    if(ids.has(t.id))out.push(['Trùng ID',t]);ids.add(t.id);
    if(t.wsId&&!wsIds.has(t.wsId))out.push(['Luồng công việc không còn tồn tại',t]);
    if(t.mtId&&!mtIds.has(t.mtId))out.push(['Nhiệm vụ chính không còn tồn tại',t]);
    if(t.date&&!validD(t.date))out.push(['Ngày không hợp lệ',t]);
    if(t.start&&!validT(t.start))out.push(['Giờ không hợp lệ',t]);
    if(!(+t.dur>0))out.push(['Thời lượng không hợp lệ',t]);
    if(t.status==='done'&&!t.completedAt)out.push(['Đã hoàn thành nhưng thiếu thời điểm hoàn thành',t]);
    if(!ST[t.status])out.push(['Trạng thái không hợp lệ',t]);
    const ro=D.hist.events.filter(e=>e.type==='rollover'&&e.taskId===t.id).length;
    if(ro!==(t.rolloverCount||0))out.push([`Số lần chuyển tiếp (${t.rolloverCount||0}) khác nhật ký (${ro})`,t]);
    if(t.rolloverCount&&!t.originalDate)out.push(['Đã chuyển tiếp nhưng thiếu ngày lịch ban đầu',t]);
  });
  const cf=conflicts(D.tasks.filter(t=>t.status!=='done'&&t.date>=today()));
  if(cf.size)out.push([`${cf.size} việc sắp tới đang trùng giờ (dùng Re-plan để xử lý)`,null]);
  $('checkOut').innerHTML=`<div class="banner ${out.length?'':'calm'}" style="margin-top:12px"><p>${out.length?`<b>Phát hiện ${out.length} điểm cần xem:</b><br>`+out.slice(0,40).map(([w,t])=>esc(w)+(t?': '+esc(t.title)+(t.date?' ('+esc(vn(t.date))+')':''):'')).join('<br>'):'<b>Dữ liệu toàn vẹn.</b> Không có tham chiếu hỏng, ID trùng, ngày giờ sai, và số lần chuyển tiếp khớp nhật ký.'}</p></div>`;
}
function ics(){
  const wk=wkView,a=weekTasks(wk).filter(t=>validT(t.start));if(!a.length){toast('Tuần này chưa có việc có giờ');return}
  const f=(d,m)=>d.replace(/-/g,'')+'T'+hm(m).replace(':','')+'00',e=s=>String(s).replace(/[\\,;]/g,x=>'\\'+x).replace(/\n/g,'\\n');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//AI Weekly Planner//VI','CALSCALE:GREGORIAN'];
  a.forEach(t=>L.push('BEGIN:VEVENT','UID:'+t.id+'@ai-weekly-planner','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z','DTSTART:'+f(t.date,toMin(t.start)),'DTEND:'+f(t.date,endM(t)),'SUMMARY:'+e((t.status==='done'?'✓ ':'')+t.title),'DESCRIPTION:'+e([wsOf(t.wsId).name,t.note].filter(Boolean).join(' · ')),'END:VEVENT'));
  L.push('END:VCALENDAR');download(`ke-hoach-${wk}.ics`,L.join('\r\n'),'text/calendar');
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act],[data-edit],[data-new],[data-newsub],[data-roll],[data-wk],[data-filt],[data-mtedit],[data-wscol],[data-wsdel],[data-rmode],[data-restore]');if(!el)return;const d=el.dataset;
  if(d.edit){const t=D.tasks.find(x=>x.id===d.edit);if(t)taskDlg(t,false);return}
  if(d.new!==undefined){taskDlg(newTask(d.new),true);return}
  if(d.newsub){taskDlg(newTask('',d.newsub),true);return}
  if(d.roll){const t=D.tasks.find(x=>x.id===d.roll);if(t)rollDlg(t);return}
  if(d.wk){wkView=d.wk==='0'?curWk():addD(wkView,+d.wk);render();return}
  if(d.filt){filt[d.filt]=!filt[d.filt];render();return}
  if(d.mtedit){const m=mtOf(d.mtedit);if(m)mtDlg(m,false);return}
  if(d.wscol){const w=D.ws.find(x=>x.id===d.wscol);if(w){w.col=d.c;commit()}return}
  if(d.wsdel){const used=D.tasks.some(t=>t.wsId===d.wsdel)||D.mt.some(m=>m.wsId===d.wsdel);if(used){toast('Luồng đang có nhiệm vụ. Chuyển nhiệm vụ sang luồng khác trước khi xoá.');return}if(!confirmTwice('ws'+d.wsdel))return;D.ws=D.ws.filter(w=>w.id!==d.wsdel);commit('Đã xoá luồng');return}
  if(d.rmode){rMode=d.rmode;render();return}
  if(d.restore){if(!confirmTwice('rs'+d.restore))return;restore(d.restore);return}
  switch(d.act){
    case'replan':{const wk=view==='ke-hoach-tuan'?wkView:curWk();if(wk<curWk()){toast('Không Re-plan tuần đã qua');return}planDlg(buildPlan(wk,{gen:1,fix:1}));break}
    case'autoplan':{const p=buildPlan(wkView,{gen:1,fix:0});planDlg(p,'Auto Plan · '+wkTitle(wkView));break}
    case'dismiss':notice=null;render();break;
    case'keep-sample':commit('Đã lưu dữ liệu mẫu làm dữ liệu của bạn');break;
    case'start-empty':D={tasks:[],ws:[{id:uid(),name:'Giảng dạy',col:COLS[0]},{id:uid(),name:'Hành chính',col:COLS[2]},{id:uid(),name:'Dự án',col:COLS[3]},{id:uid(),name:'Phát triển cá nhân',col:COLS[1]}],mt:[],set:defSet(),hist:{events:[],weeks:{[curWk()]:{at:new Date().toISOString()}}}};commit('Đã bắt đầu với dữ liệu trống. Thêm nhiệm vụ chính để app tự lập kế hoạch.');location.hash='nhiem-vu-chinh';break;
    case'dr-connect':drConnect();break;
    case'dr-sync':drPull(true);break;
    case'dr-off':if(!confirmTwice('droff'))return;DR.on=0;drState='off';drSave();render();toast('Đã ngắt kết nối. Dữ liệu trên Drive vẫn giữ nguyên.');break;
    case'dr-remote':drUseRemote();break;
    case'dr-force':if(MODE==='RECOVERY'){toast('Dữ liệu máy này đang hỏng, hãy dùng bản trên Drive');return}DR.remote=null;drState='';drPending=null;drPush(true).then(()=>{render();if(drState==='ok')toast('Đã ghi bản máy này lên Drive')});break;
    case'dr-code':fetch('drive-sync/Code.gs').then(r=>{if(!r.ok)throw 0;return r.text()}).then(t=>navigator.clipboard.writeText(t)).then(()=>toast('Đã copy mã Apps Script')).catch(()=>{toast('Không copy được, mở "Xem mã trên GitHub" để chép');});break;
    case'accept-recovery':snapshot('Trước khi tiếp tục với dữ liệu còn lại');MODE='USER';PROBLEMS=[];commit('Đã tiếp tục và lưu dữ liệu hiện có');break;
    case'addws':{const n=$('newWs').value.trim();if(!n){$('newWs').focus();return}D.ws.push({id:uid(),name:n,col:COLS[D.ws.length%COLS.length]});commit('Đã thêm luồng');break}
    case'newmt':mtDlg({id:uid(),title:'',wsId:D.ws[0]?.id||'',priority:'tb',deadline:'',desc:'',mode:'w',h:1,n:1,per:'',day:-1,time:'',steps:'',createdAt:new Date().toISOString()},true);break;
    case'copyrep':navigator.clipboard.writeText($('repTxt').textContent).then(()=>toast('Đã copy báo cáo')).catch(()=>toast('Không copy được, hãy bôi đen và copy tay'));break;
    case'export':download(`ai-weekly-planner-${today()}.json`,exportJSON(),'application/json');break;
    case'copyjson':navigator.clipboard.writeText(exportJSON()).then(()=>toast('Đã copy bản sao lưu')).catch(()=>{$('impTxt').value=exportJSON();toast('Không copy được, nội dung đã đưa vào ô bên dưới')});break;
    case'importtxt':importData($('impTxt').value);break;
    case'tkb16':importTKB16();break;
    case'nd16':applyND16();break;
    case'bgplan':bgPlan(wkView);break;
    case'snap':if(MODE==='SAMPLE'){toast('Đang ở dữ liệu mẫu, chưa có gì để sao lưu');return}snapshot('Tạo tay');render();toast('Đã tạo bản sao lưu');break;
    case'check':integrity();break;
    case'migrate':migrateOld();break;
    case'ics':ics();break;
    case'reset':if(!confirmTwice('reset'))return;snapshot('Trước khi xoá toàn bộ dữ liệu');D={tasks:[],ws:[],mt:[],set:defSet(),hist:{events:[],weeks:{}}};MODE='USER';commit('Đã xoá. Bản sao lưu ngay trước đó vẫn còn trong danh sách.');break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target,d=el.dataset;
  if(d.done){const t=D.tasks.find(x=>x.id===d.done);if(t)setDone(t,el.checked);return}
  if(d.status){const t=D.tasks.find(x=>x.id===d.status);if(t){t.status=el.value;logE({type:'status',taskId:t.id,title:t.title,reason:ST[t.status]});commit()}return}
  if(d.wsname){const w=D.ws.find(x=>x.id===d.wsname);if(w){w.name=el.value.trim()||w.name;commit()}return}
  if(el.id==='fq'||el.id==='fst'||el.id==='fws'||el.id==='fpr'||el.id==='fod'){tq={q:$('fq').value,st:$('fst').value,ws:$('fws').value,pr:$('fpr').value,od:$('fod').value};render();return}
  if(el.id==='rMonth'){rMonth=el.value||rMonth;render();return}
  if(el.id==='drDev'){DR.device=el.value.trim().slice(0,40)||DR.device;drSave();return}
  if(el.id==='impFile'){const f=el.files&&el.files[0];if(f)f.text().then(importData);return}
  const c=D.set;let k=1;
  if(el.id==='sName')c.name=el.value;else if(el.id==='sW1')c.w1=el.value||c.w1;else if(el.id==='sMax')c.max=+el.value;else if(el.id==='sAuto')c.autoWeek=el.checked?1:0;else if(el.id==='sNext')c.nextWeek=el.checked?1:0;else if(el.id==='sApply')c.autoApply=el.checked?1:0;
  else if(d.sday!==undefined)c.days[+d.sday]=el.checked?1:0;else if(d.son!==undefined)c.ses[+d.son].on=el.checked?1:0;else if(d.ss!==undefined)c.ses[+d.ss].s=el.value;else if(d.se!==undefined)c.ses[+d.se].e=el.value;else k=0;
  if(k)commit('Đã lưu cài đặt');
});
